<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Loja</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <h1>Mini Loja</h1>
        </header>
        <section id="produtos">
            <h2>Produtos</h2>
            <article>
                <h3>Smartphone</h3>
                <img src="assets/iphone.jpg" alt="Smartphone Apple Iphone" width="250" height="250" loading="lazy">
                <p>Preço: R$ 242,90</p>
            </article>
            <article>
                <h3>Camiseta</h3>
                <figure>
                    <img src="assets/camisa.jpg" alt="Camisa Branca" width="250" height="250" loading="lazy">
                    <figcaption>Camiseta branca - R$ 59,90</figcaption>
                </figure>
                <!-- Quando o caminho ficou errado a imagem não foi carregada e o navegador exibiu o texto alternativo da imagem. -->
            </article>
        </section>
        <section>
            <h4>Vídeo do produto</h4>
            <video controls width="400" preload="metadata">
                <source src="assets/video.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
        </section>
        <section>
            <h4>Descrição em áudio</h4>
            <audio controls preload="metadata">
                <source src="assets/descricao-produto.mp3" type="audio/mpeg">
                Seu navegador não suporta áudio.
            </audio>
        </section>
        <section>
            <h4>Conteúdo externo</h4>
            <iframe src="https://www.youtube.com/embed/a4cA0ET9DRY" width="400" height="225"
                title="Vídeo externo sobre tecnologia" loading="lazy" allowfullscreen>
            </iframe>
        </section>
        <footer>
            <p>(Mal) Desenvolvido por: (Mau) Tiago Henrique Padilha, (Os dois né) Vinicius Genaro Fernandes,(bEM)
                William Davi Georg
            </p>
        </footer>
    </main>
</body>

</html>
