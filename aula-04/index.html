<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Loja</title>
</head>

<body>
    <main>
        <h1>Mini Loja</h1>
        <section id="produtos">
            <h2>Produtos</h2>
            <article>
                <h3>Smartphone</h3>
                <img src="assets/iphone.jpg" alt="Smartphone Apple Iphone" width="250" height="250" loading="lazy">
                <p>Preço: R$ 242,90</p>
            </article>
            <article>
                <h3>Camiseta</h3>
                <figure>
                    <img src="assets/camisa.jpg" alt="Camisa Branca" width="250" height="250" loading="lazy">
                    <figcaption>Camiseta branca - R$ 59,90</figcaption>
                </figure>

            </article>
        </section>
        <section>
            <h4>Descrição em áudio</h4>
            <video controls width="400" preload="metadata">
                <source src="assets/video.mp4" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
        </section>
    </main>
</body>

</html>
