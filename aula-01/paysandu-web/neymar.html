<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Neymaaaar</title>
    <style>
      * {
        margin: auto;
        font-family: "Courier New", Courier, monospace;
        background: black;
        color: white;
        text-size: 700px;
      }
      body {
        position: relative;
        overflow-x: hidden;
      }
      .snow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        visibility: hidden;
        opacity: 0;
        background-image:
          radial-gradient(
            circle,
            rgba(255, 255, 255, 0.9) 1px,
            transparent 1px
          ),
          radial-gradient(
            circle,
            rgba(255, 255, 255, 0.75) 1px,
            transparent 1px
          );
        background-size:
          18px 18px,
          30px 30px;
        background-position:
          0 0,
          120px 120px;
        animation: snow 16s linear infinite;
        animation-play-state: paused;
        transition:
          opacity 0.5s ease,
          visibility 0s linear 0.5s;
      }
      .snow.active {
        visibility: visible;
        opacity: 0.45;
        animation-play-state: running;
        transition: opacity 0.5s ease;
      }
      @keyframes snow {
        0% {
          background-position:
            0 0,
            50px 0,
            100px 0;
        }
        100% {
          background-position:
            -200px 2000px,
            -150px 2200px,
            -100px 2400px;
        }
      }
      .button-wrapper {
        position: relative;
        display: inline-block;
        transform-style: preserve-3d;
        transition: transform 0.2s ease;
        padding: 40px;
      }

      .spiderverse-button {
        position: relative;
        overflow: hidden;
        padding: 15px 30px;
        font-size: 24px;
        font-weight: 900;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        background: #111;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 3px;
        transform-style: preserve-3d;
        transition: all 0.15s ease;
        font-family: Arial, sans-serif;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000;
      }

      .glitch-text {
        position: relative;
        display: inline-block;
      }

      .glitch-layers {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .glitch-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50px;
        opacity: 0;
        transition: all 0.15s ease;
        pointer-events: none;
      }

      .layer-1 {
        color: #0ff;
        transform-origin: center;
      }

      .layer-2 {
        color: #f0f;
        transform-origin: center;
      }

      .button-wrapper:hover .layer-1 {
        opacity: 1;
        animation: glitchLayer1 0.4s steps(2) infinite;
      }

      .button-wrapper:hover .layer-2 {
        opacity: 1;
        animation: glitchLayer2 0.4s steps(2) infinite;
      }

      .button-wrapper:hover .spiderverse-button {
        animation: buttonGlitch 0.3s steps(2) infinite;
        box-shadow:
          0 0 20px rgba(255, 255, 255, 0.5),
          0 0 30px rgba(0, 255, 255, 0.5),
          0 0 40px rgba(255, 0, 255, 0.5);
      }

      .noise {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: repeating-radial-gradient(
          circle at 50% 50%,
          transparent 0,
          rgba(0, 0, 0, 0.1) 1px,
          transparent 2px
        );
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
        animation: noise 0.2s steps(2) infinite;
      }

      .button-wrapper:hover .noise {
        opacity: 1;
      }

      @keyframes buttonGlitch {
        0% {
          transform: translate(0) scale(1.1);
        }
        25% {
          transform: translate(-10px, 5px) scale(1.15) skew(-5deg);
        }
        50% {
          transform: translate(10px, -5px) scale(1.1) skew(5deg);
        }
        75% {
          transform: translate(-15px, -5px) scale(1.05) skew(-3deg);
        }
        100% {
          transform: translate(0) scale(1.1);
        }
      }

      @keyframes glitchLayer1 {
        0% {
          transform: translate(-20px, -10px) scale(1.1) skew(-10deg);
          clip-path: polygon(0 20%, 100% 20%, 100% 50%, 0 50%);
        }
        25% {
          transform: translate(20px, 10px) scale(1.2) skew(10deg);
          clip-path: polygon(0 30%, 100% 30%, 100% 60%, 0 60%);
        }
        50% {
          transform: translate(-15px, 5px) scale(0.9) skew(-5deg);
          clip-path: polygon(0 10%, 100% 10%, 100% 40%, 0 40%);
        }
        75% {
          transform: translate(15px, -5px) scale(1.3) skew(5deg);
          clip-path: polygon(0 40%, 100% 40%, 100% 70%, 0 70%);
        }
        100% {
          transform: translate(-20px, -10px) scale(1.1) skew(-10deg);
          clip-path: polygon(0 20%, 100% 20%, 100% 50%, 0 50%);
        }
      }

      @keyframes glitchLayer2 {
        0% {
          transform: translate(20px, 10px) scale(1.1) skew(10deg);
          clip-path: polygon(0 50%, 100% 50%, 100% 80%, 0 80%);
        }
        25% {
          transform: translate(-20px, -10px) scale(1.2) skew(-10deg);
          clip-path: polygon(0 60%, 100% 60%, 100% 90%, 0 90%);
        }
        50% {
          transform: translate(15px, -5px) scale(0.9) skew(5deg);
          clip-path: polygon(0 40%, 100% 40%, 100% 70%, 0 70%);
        }
        75% {
          transform: translate(-15px, 5px) scale(1.3) skew(-5deg);
          clip-path: polygon(0 70%, 100% 70%, 100% 100%, 0 100%);
        }
        100% {
          transform: translate(20px, 10px) scale(1.1) skew(10deg);
          clip-path: polygon(0 50%, 100% 50%, 100% 80%, 0 80%);
        }
      }

      @keyframes noise {
        0% {
          transform: translate(0, 0);
        }
        10% {
          transform: translate(-5%, -5%);
        }
        20% {
          transform: translate(10%, 5%);
        }
        30% {
          transform: translate(-5%, 10%);
        }
        40% {
          transform: translate(15%, -5%);
        }
        50% {
          transform: translate(-10%, 15%);
        }
        60% {
          transform: translate(5%, -10%);
        }
        70% {
          transform: translate(-15%, 5%);
        }
        80% {
          transform: translate(10%, 10%);
        }
        90% {
          transform: translate(-5%, 15%);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      .glitch-slice {
        position: absolute;
        width: 120%;
        height: 5px;
        background: #fff;
        opacity: 0;
        animation: slice 3s linear infinite;
      }

      @keyframes slice {
        0% {
          top: -10%;
          opacity: 0;
        }
        1% {
          opacity: 0.5;
        }
        3% {
          opacity: 0;
        }
        50% {
          top: 110%;
        }
        100% {
          top: 110%;
        }
      }

      img {
        border-radius: 500px;
        transition: transform 50s ease-in-out;
      }

      img:hover {
        transform: rotate(92000000deg);
      }
    </style>
  </head>
  <body>
    <div class="snow"></div>
    <button><a href="index.html">Voltar</a></button>
    <hr />
    <div class="button-wrapper">
      <button class="spiderverse-button" type="button">
        NEYMAAAR
        <div class="glitch-layers">
          <div class="glitch-layer layer-1">NEYMÁAAAAA</div>
          <div class="glitch-layer layer-2">NEYMA JUNIOR</div>
        </div>
        <div class="noise"></div>
        <div class="glitch-slice"></div>
      </button>
    </div>
    <section>
      <a
        href="explosion.html?img=https%3A%2F%2Fi.pinimg.com%2F736x%2F0f%2F62%2Fa7%2F0f62a7561d1534c4fa8628bc391be08b.jpg"
      >
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQz2qXtvceP5s0rupulT5nVBHBAb_4vzUxtDgV-2XyOww&s"
          alt="Naverdathi"
          width="600px"
        />
      </a>
    </section>
    <script>
      const snow = document.querySelector(".snow");
      const neymButton = document.querySelector(".spiderverse-button");
      neymButton.addEventListener("click", () => {
        snow.classList.add("active");
      });
    </script>
  </body>
</html>
