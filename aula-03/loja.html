<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    <h1>Loja</h1>
    <nav>
        <ul>
            <li><a href="#inicio">Início</a></li>
            <li><a href="#produtos">Produtos</a></li>
            <li><a href="#cadastro">Cadastro</a></li>
        </ul>
    </nav>
    <section id="produtos">
        <h2>Produtos</h2>
        <ul>
            <li>Meia-Calça</li>
            <li>Geladeira</li>
            <li>Saco de Cimento</li>
        </ul>
        <table>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
            </tr>
            <tr>
                <td>Meia-Calça</td>
                <td>R$ 242,90</td>
                </tr>
                <tr>
                    <td>Geladeira (brick)</td>
                    <td>R$ 100,90</td>
                </tr>
                <tr>
                    <td>Saco de Cimento (Tijolo)</td>
                    <td>R$ 29,90</td>
                </tr>
            </table>
        </ul>
    </section>
    <section id="cadastro">
        <h2>Cadastro</h2>
        <form>
            <fieldset>
                <legend>Dados pessoais</legend>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
                <br><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </fieldset>
            <br>
            <fieldset>
                <legend>Acesso</legend>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha">
                <br><br>
                <label for="produto">Tipo de pessoa:</label>
                <select name="produto" id="produto">
                    <option value="PJ">Pessoa Jurídica</option>
                    <option value="PF">Pessoa Física</option>
                </select>
            </fieldset>
            <br>
            <button type="submit">Enviar</button>
        </form>
    </section>
    <footer>
        <p><a href="https://www.amazon.com" target="_blank" rel="noopener noreferrer">Abrir Amazon em nova aba</a></p>
    </footer>
    </main>
</body>
</html>
